[project]
name = "trajviz-obs-bridge"
version = "0.1.16"
description = "Shared TrajViz bridge for /obs host adapters (JSON on stdout)."
license = "MIT"
requires-python = ">=3.11"
dependencies = ["agent-trajviz[all]>=0.2.0,<0.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "jsonschema>=4.23,<5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
